components:
  schemas:
    CreateResourceRequestDTO:
      properties:
        description:
          type: string
        name:
          type: string
        price:
          type: integer
      type: object
    CreateTemplateRequestDTO:
      properties:
        description:
          type: string
        difficulty:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        resources:
          items:
            $ref: "#/components/schemas/ResourceRefDTO"
          type: array
        steps:
          items:
            $ref: "#/components/schemas/StepDTO"
          type: array
        unit:
          type: string
      type: object
    ResourceJSONResponseDTO:
      properties:
        description:
          type: string
        id:
          type: integer
        name:
          type: string
        price:
          type: integer
      type: object
    ResourceRefDTO:
      properties:
        quantity:
          type: integer
        resource_id:
          type: integer
        unit:
          type: string
      type: object
    ResourceRefResponseDTO:
      properties:
        quantity:
          type: integer
        resource_id:
          type: integer
        unit:
          type: string
      type: object
    StepDTO:
      properties:
        instructions:
          type: string
        name:
          type: string
      type: object
    StepJSONResponseDTO:
      properties:
        instructions:
          type: string
        name:
          type: string
        order:
          type: integer
      type: object
    TemplateJSONResponseDTO:
      properties:
        description:
          type: string
        difficulty:
          type: integer
        id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        resources:
          items:
            $ref: "#/components/schemas/ResourceRefResponseDTO"
          type: array
        steps:
          items:
            $ref: "#/components/schemas/StepJSONResponseDTO"
          type: array
        unit:
          type: string
      type: object
    TemplateListJSONResponseDTO:
      properties:
        description:
          type: string
        id:
          type: integer
        name:
          type: string
      type: object
    UpdateResourceRequestDTO:
      properties:
        description:
          type: string
        id:
          type: integer
        name:
          type: string
        price:
          type: integer
      type: object
    UpdateTemplateRequestDTO:
      properties:
        description:
          type: string
        difficulty:
          type: integer
        id:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        resources:
